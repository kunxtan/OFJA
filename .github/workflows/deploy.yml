name: Auto Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch: {}   # กดรันเองได้จากแท็บ Actions

# push ติดกันหลายครั้ง: รอให้ตัวก่อนจบก่อน ไม่ deploy ซ้อนกัน
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOMAIN: only-foods.cskmitl.com
  # อีเมลสำหรับ Let's Encrypt แจ้งเตือนใบรับรองใกล้หมดอายุ (เว้นว่างได้)
  CERTBOT_EMAIL: ""
  APP_DIR: /home/ubuntu/OFJA
  COMPOSE_FILE_NAME: docker-compose.cloud.yml

jobs:
  deploy:
    # self-hosted runner บนเครื่อง server (only-foods.cskmitl.com)
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          set -e
          cd "$APP_DIR"
          # ใช้ reset แทน pull: ถ้ามีไฟล์ถูกแก้บน server จะไม่ค้างเพราะ merge conflict (.env ไม่อยู่ใน git จึงไม่โดนลบ)
          git fetch origin main
          git reset --hard origin/main

      - name: Check server config
        run: |
          set -e
          cd "$APP_DIR/onlyfoods-app"
          # .env อยู่บน server เท่านั้น ไม่อยู่ใน git
          test -f .env || { echo "ไม่พบ onlyfoods-app/.env บน server (คัดลอกจาก .env.example แล้วแก้ค่า)"; exit 1; }
          sudo mkdir -p /var/www/certbot /etc/letsencrypt

      - name: Get HTTPS certificate (first time only)
        run: |
          set -e
          cd "$APP_DIR/onlyfoods-app"
          if sudo test -f "/etc/letsencrypt/live/$DOMAIN/fullchain.pem"; then
            echo "มีใบรับรองของ $DOMAIN แล้ว ข้ามขั้นนี้"
            exit 0
          fi

          echo "ยังไม่มีใบรับรอง: เปิดเว็บแบบ HTTP ชั่วคราวเพื่อให้ Let's Encrypt ตรวจโดเมนผ่านพอร์ต 80"
          sudo env NGINX_CONF=./nginx.http-only.conf docker compose -f "$COMPOSE_FILE_NAME" up -d --build --remove-orphans

          if [ -n "$CERTBOT_EMAIL" ]; then EMAIL_ARG="--email $CERTBOT_EMAIL"; else EMAIL_ARG="--register-unsafely-without-email"; fi
          sudo docker compose -f "$COMPOSE_FILE_NAME" run --rm --entrypoint certbot certbot \
            certonly --webroot -w /var/www/certbot -d "$DOMAIN" \
            $EMAIL_ARG --agree-tos --non-interactive

      - name: Build and start (HTTPS)
        run: |
          set -e
          cd "$APP_DIR/onlyfoods-app"
          # ไม่ใช้ 'docker compose down' : down จะหยุดทุก service (เว็บล่มทั้งหมด) ทุกครั้งที่ push
          # up -d --build จะสร้างใหม่เฉพาะ service ที่เปลี่ยน และไม่แตะ volume ข้อมูล
          sudo env NGINX_CONF=./nginx.conf docker compose -f "$COMPOSE_FILE_NAME" up -d --build --remove-orphans
          sudo docker compose -f "$COMPOSE_FILE_NAME" ps
          sudo docker image prune -f

      - name: Health check (HTTPS)
        run: |
          # ยิงเข้า 443 ของเครื่องตัวเองด้วยชื่อโดเมนจริง: ตรวจทั้งใบรับรองและ backend ในครั้งเดียว
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 --resolve "$DOMAIN:443:127.0.0.1" "https://$DOMAIN/api/food-court/status" > /dev/null; then
              echo "OK: https://$DOMAIN พร้อมใช้งาน"
              exit 0
            fi
            echo "รอ backend/db สตาร์ท... ($i/30)"
            sleep 5
          done
          echo "เว็บไม่ตอบหลัง 150 วินาที - log ล่าสุด:"
          cd "$APP_DIR/onlyfoods-app"
          sudo docker compose -f "$COMPOSE_FILE_NAME" logs --tail=50 proxy backend
          exit 1
