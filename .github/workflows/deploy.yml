name: Auto Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch: {}   # กดรันเองได้จากแท็บ Actions

# push ติดกันหลายครั้ง: รอให้ตัวก่อนจบก่อน ไม่ deploy ซ้อนกัน
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOMAIN: only-foods.cskmitl.com
  APP_DIR: /home/ubuntu/OFJA
  COMPOSE_FILE_NAME: docker-compose.cloud.yml

jobs:
  deploy:
    # self-hosted runner บนเครื่อง server (only-foods.cskmitl.com)
    runs-on: self-hosted
    # ค่าเริ่มต้น 6 ชม. : deploy ปกติใช้ไม่กี่นาที ค้างเกินนี้ให้หยุดและแจ้ง fail
    timeout-minutes: 30

    steps:
      - name: Pull latest code
        run: |
          set -e
          cd "$APP_DIR"
          # ใช้ reset แทน pull: ถ้ามีไฟล์ถูกแก้บน server จะไม่ค้างเพราะ merge conflict (.env ไม่อยู่ใน git จึงไม่โดนลบ)
          git fetch origin main
          git reset --hard origin/main

      - name: Check server config
        run: |
          cd "$APP_DIR/onlyfoods-app"
          # .env อยู่บน server เท่านั้น ไม่อยู่ใน git
          test -f .env || { echo "ไม่พบ onlyfoods-app/.env บน server (คัดลอกจาก .env.example แล้วแก้ค่า)"; exit 1; }

      - name: Pull images (retry on network errors)
        run: |
          cd "$APP_DIR/onlyfoods-app"
          # Docker Hub ตอบ 502/timeout เป็นครั้งคราว: โหลด image ล่วงหน้าแบบลองซ้ำ ก่อนถึงขั้นที่ต้องใช้จริง
          retry() {
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "ดาวน์โหลดไม่สำเร็จ ลองใหม่ใน 20 วินาที ($i/5)"
              sleep 20
            done
            return 1
          }
          # image ที่ compose ใช้ตรง ๆ
          retry sudo docker compose -f "$COMPOSE_FILE_NAME" pull db proxy || exit 1
          # base image ที่ Dockerfile ของ backend/frontend ใช้ตอน build
          for img in python:3.12-slim node:20-alpine nginx:alpine; do
            retry sudo docker pull "$img" || exit 1
          done

      - name: Apply database migrations
        run: |
          set -e
          cd "$APP_DIR/onlyfoods-app"
          # init.sql รันเฉพาะตอนฐานข้อมูลว่าง : ฐานที่มีข้อมูลอยู่แล้วต้องอัปเดต schema ด้วยไฟล์ใน database/migrations/
          # ทุกไฟล์รันซ้ำได้ (เช็คก่อนแก้ ไม่ลบข้อมูล) ; รันก่อน backend ใหม่สตาร์ท
          # ยังไม่มี db (ติดตั้งครั้งแรก) = ข้าม เพราะ init.sql สร้างให้ครบแล้ว
          sudo docker compose -f "$COMPOSE_FILE_NAME" up -d db
          db_ok=0
          for i in $(seq 1 60); do
            if sudo docker compose -f "$COMPOSE_FILE_NAME" exec -T db sh -c 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent'; then
              db_ok=1; break
            fi
            echo "รอ db... ($i/60)"; sleep 5
          done
          # ต่อ db ไม่ได้ = หยุด deploy (เดิมข้าม migration แล้วไปต่อ -> backend ใหม่ทำงานบน schema เก่า = error 500)
          if [ "$db_ok" != 1 ]; then
            echo "::error::ต่อฐานข้อมูลไม่ได้ภายใน 5 นาที หยุด deploy (ดู log ของ container db)"; exit 1
          fi
          # มีตาราง Store แล้ว = ฐานที่ใช้งานอยู่ -> ต้องรัน migration ; ยังไม่มี = ติดตั้งครั้งแรก (init.sql สร้างครบแล้ว) -> ข้าม
          has_store=$(echo "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='onlyfood' AND TABLE_NAME='Store';" \
            | sudo docker compose -f "$COMPOSE_FILE_NAME" exec -T db sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -B 2>/dev/null') \
            || { echo "::error::ถามฐานข้อมูลไม่สำเร็จ หยุด deploy"; exit 1; }
          if [ "$(echo "$has_store" | tr -d '[:space:]')" != "1" ]; then
            echo "ยังไม่มีฐาน onlyfood (ติดตั้งครั้งแรก init.sql สร้างให้) - ข้าม migration"; exit 0
          fi
          # กันค้าง: รอล็อกตารางได้ไม่เกิน 60 วิ, ปิด migration ค้างจากรอบก่อน และ connection ที่ถือตารางค้าง (ดูในไฟล์)
          DC="sudo docker compose -f $COMPOSE_FILE_NAME" bash database/apply_migrations.sh

      - name: Limit app database user
        run: |
          cd "$APP_DIR/onlyfoods-app"
          # L26 : user ที่ backend ใช้ (MYSQL_USER) ได้แค่ SELECT/INSERT/UPDATE/DELETE ; migration ยังใช้ root
          DC="sudo docker compose -f $COMPOSE_FILE_NAME" bash database/restrict_app_user.sh

      - name: Build and start
        run: |
          set -e
          cd "$APP_DIR/onlyfoods-app"
          # ไม่ใช้ 'docker compose down' : down จะหยุดทุก service (เว็บล่มทั้งหมด) ทุกครั้งที่ push
          # up -d --build จะสร้างใหม่เฉพาะ service ที่เปลี่ยน และไม่แตะ volume ข้อมูล
          # --remove-orphans : ลบ container ที่ไม่มีในไฟล์แล้ว (เช่น certbot จากรอบก่อน)
          sudo docker compose -f "$COMPOSE_FILE_NAME" up -d --build --remove-orphans
          # nginx.conf ถูก mount เป็นไฟล์เดี่ยว : git pull เขียนไฟล์ใหม่ (inode ใหม่) แต่ container ยังเห็นไฟล์เก่า
          # และ up -d ไม่สร้าง proxy ใหม่เพราะ image ไม่เปลี่ยน -> ถ้าไฟล์ในเครื่องกับใน container ไม่ตรงกัน
          # ให้ตรวจ config ใหม่ก่อน (ผิด = ไม่แตะ proxy ตัวเดิม) แล้วค่อยรีสตาร์ท proxy (เว็บสะดุด ~1 วินาที)
          want=$(sha256sum nginx.conf | cut -d' ' -f1)
          have=$(sudo docker compose -f "$COMPOSE_FILE_NAME" exec -T proxy sha256sum /etc/nginx/nginx.conf 2>/dev/null | cut -d' ' -f1 || true)
          if [ "$want" != "$have" ]; then
            echo "nginx.conf เปลี่ยน -> ตรวจ config แล้วรีสตาร์ท proxy"
            sudo docker run --rm --network "$(sudo docker compose -f "$COMPOSE_FILE_NAME" ps -q proxy | xargs -r sudo docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}')" \
              -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine nginx -t
            sudo docker compose -f "$COMPOSE_FILE_NAME" up -d --force-recreate --no-deps proxy
          fi
          sudo docker compose -f "$COMPOSE_FILE_NAME" ps
          sudo docker image prune -f

      - name: Health check
        run: |
          # ยิงเข้าพอร์ต 80 ของเครื่องตัวเองแบบเดียวกับที่ Cloudflare ส่งมา
          # ต้องผ่านทั้ง API (backend + db) และหน้าเว็บ (คอนเทนเนอร์ frontend : nginx.conf ของ frontend ผิด = เว็บขาวทั้งเว็บ)
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 -H "Host: $DOMAIN" "http://127.0.0.1/api/food-court/status" > /dev/null \
               && curl -fsS --max-time 5 -H "Host: $DOMAIN" "http://127.0.0.1/" | grep -q '<div id="root">'; then
              echo "OK: เว็บพร้อมใช้งานที่ https://$DOMAIN"
              exit 0
            fi
            echo "รอ backend/db/frontend สตาร์ท... ($i/30)"
            sleep 5
          done
          echo "เว็บไม่ตอบหลัง 150 วินาที - log ล่าสุด:"
          cd "$APP_DIR/onlyfoods-app"
          sudo docker compose -f "$COMPOSE_FILE_NAME" logs --tail=50 proxy backend frontend
          exit 1
