name: Auto Deploy to Server

# บอกให้ระบบทำงานตอนที่เรา push โค้ดเข้า branch "main" 
# (ถ้าโปรเจกต์คุณใช้ branch ชื่อ "master" ให้แก้คำว่า main เป็น master นะครับ)
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Server and Update
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # ตรง script คือคำสั่งที่บอทจะพิมพ์ลงใน Server ให้เรา
          script: |
            cd /OFJA/onlyfoods-app 
            git pull origin main
            docker compose down
            docker compose up -d --build