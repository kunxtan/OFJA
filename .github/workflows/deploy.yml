name: Auto Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch: {}   # กดรันเองได้จากแท็บ Actions

# push ติดกันหลายครั้ง: รอให้ตัวก่อนจบก่อน ไม่ deploy ซ้อนกัน
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOMAIN: only-foods.cskmitl.com
  APP_DIR: /home/ubuntu/OFJA
  COMPOSE_FILE_NAME: docker-compose.cloud.yml

jobs:
  deploy:
    # self-hosted runner บนเครื่อง server (only-foods.cskmitl.com)
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          set -e
          cd "$APP_DIR"
          # ใช้ reset แทน pull: ถ้ามีไฟล์ถูกแก้บน server จะไม่ค้างเพราะ merge conflict (.env ไม่อยู่ใน git จึงไม่โดนลบ)
          git fetch origin main
          git reset --hard origin/main

      - name: Check server config
        run: |
          cd "$APP_DIR/onlyfoods-app"
          # .env อยู่บน server เท่านั้น ไม่อยู่ใน git
          test -f .env || { echo "ไม่พบ onlyfoods-app/.env บน server (คัดลอกจาก .env.example แล้วแก้ค่า)"; exit 1; }

      - name: Pull images (retry on network errors)
        run: |
          cd "$APP_DIR/onlyfoods-app"
          # Docker Hub ตอบ 502/timeout เป็นครั้งคราว: โหลด image ล่วงหน้าแบบลองซ้ำ ก่อนถึงขั้นที่ต้องใช้จริง
          retry() {
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "ดาวน์โหลดไม่สำเร็จ ลองใหม่ใน 20 วินาที ($i/5)"
              sleep 20
            done
            return 1
          }
          # image ที่ compose ใช้ตรง ๆ
          retry sudo docker compose -f "$COMPOSE_FILE_NAME" pull db proxy || exit 1
          # base image ที่ Dockerfile ของ backend/frontend ใช้ตอน build
          for img in python:3.12-slim node:20-alpine nginx:alpine; do
            retry sudo docker pull "$img" || exit 1
          done

      - name: Build and start
        run: |
          set -e
          cd "$APP_DIR/onlyfoods-app"
          # ไม่ใช้ 'docker compose down' : down จะหยุดทุก service (เว็บล่มทั้งหมด) ทุกครั้งที่ push
          # up -d --build จะสร้างใหม่เฉพาะ service ที่เปลี่ยน และไม่แตะ volume ข้อมูล
          # --remove-orphans : ลบ container ที่ไม่มีในไฟล์แล้ว (เช่น certbot จากรอบก่อน)
          sudo docker compose -f "$COMPOSE_FILE_NAME" up -d --build --remove-orphans
          sudo docker compose -f "$COMPOSE_FILE_NAME" ps
          sudo docker image prune -f

      - name: Health check
        run: |
          # ยิงเข้าพอร์ต 80 ของเครื่องตัวเองแบบเดียวกับที่ Cloudflare ส่งมา
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 -H "Host: $DOMAIN" "http://127.0.0.1/api/food-court/status" > /dev/null; then
              echo "OK: เว็บพร้อมใช้งานที่ https://$DOMAIN"
              exit 0
            fi
            echo "รอ backend/db สตาร์ท... ($i/30)"
            sleep 5
          done
          echo "เว็บไม่ตอบหลัง 150 วินาที - log ล่าสุด:"
          cd "$APP_DIR/onlyfoods-app"
          sudo docker compose -f "$COMPOSE_FILE_NAME" logs --tail=50 proxy backend
          exit 1
