# nginx สำหรับ server มหาลัย : เว็บอยู่หลัง Cloudflare
#   ผู้ใช้ --https--> Cloudflare --http:80--> nginx นี้
#   HTTPS/ใบรับรองจัดการที่ Cloudflare แล้ว nginx จึงฟังแค่พอร์ต 80
#   (ห้ามเด้ง 80 -> 443 ตรง ๆ : Cloudflare เรียกพอร์ต 80 เสมอ จะวนไม่จบ)
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    server_tokens off;

    # รูปสลิป/เมนู/โปรไฟล์ส่งมาเป็น base64 ใน JSON (backend จำกัดรูปละ 5 MB)
    client_max_body_size 10m;

    # IP จริงของผู้ใช้: Cloudflare ส่งมาใน CF-Connecting-IP
    # (ถ้าใช้ IP ที่ต่อเข้ามาตรง ๆ ทุกคนจะกลายเป็น IP ของ Cloudflare แล้วโดนจำกัด login รวมกัน)
    # เชื่อ header นี้เฉพาะเมื่อผู้ที่ต่อเข้ามาเป็น IP ของ Cloudflare เท่านั้น : พอร์ต 80 ต่อตรงได้โดยไม่ผ่าน Cloudflare
    # ถ้าเชื่อทุกคน ผู้โจมตีจะปลอม IP ได้ทุก request (หลบ limit_req ของ login + IP ใน AuditLog เป็นของปลอม)
    # หลัง realip ทำงาน $remote_addr = IP จริงของผู้ใช้ (หรือ IP ที่ต่อตรงเข้ามา ถ้าไม่ได้มาจาก Cloudflare)
    # ช่วง IP จาก https://www.cloudflare.com/ips-v4 และ /ips-v6 (ตรวจล่าสุด 2026-10-15)
    # ถ้า Cloudflare เพิ่มช่วงใหม่ ต้องแก้ทั้งรายการนี้และใน geo ด้านล่างให้ตรงกัน
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # IP ที่ต่อเข้ามาจริง (ก่อน realip แปลง) เป็นของ Cloudflare หรือไม่
    geo $realip_remote_addr $from_cloudflare {
        default          0;
        173.245.48.0/20  1;
        103.21.244.0/22  1;
        103.22.200.0/22  1;
        103.31.4.0/22    1;
        141.101.64.0/18  1;
        108.162.192.0/18 1;
        190.93.240.0/20  1;
        188.114.96.0/20  1;
        197.234.240.0/22 1;
        198.41.128.0/17  1;
        162.158.0.0/15   1;
        104.16.0.0/13    1;
        104.24.0.0/14    1;
        172.64.0.0/13    1;
        131.0.72.0/22    1;
        2400:cb00::/32   1;
        2606:4700::/32   1;
        2803:f800::/32   1;
        2405:b500::/32   1;
        2405:8100::/32   1;
        2a06:98c0::/29   1;
        2c0f:f248::/32   1;
    }

    # โปรโตคอลที่ผู้ใช้ใช้จริง (https ที่ Cloudflare) ส่งต่อให้ backend : เชื่อ X-Forwarded-Proto เฉพาะจาก Cloudflare
    map "$from_cloudflare:$http_x_forwarded_proto" $client_proto {
        "1:https" https;
        "1:http"  http;
        default   $scheme;
    }

    # กันเดารหัสผ่าน: จำกัดจำนวนครั้ง login ต่อ IP (backend ล็อกบัญชีหลังผิด 5 ครั้งซ้ำอีกชั้น)
    limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name only-foods.cskmitl.com _;

        # ผู้ใช้เข้ามาด้วย http:// -> เด้งไป https://
        # เช็กจาก CF-Visitor (scheme ที่ browser ใช้คุยกับ Cloudflare) จึงไม่วน ; ไม่มี header นี้ = ไม่เด้ง
        if ($http_cf_visitor ~* '"scheme":"http"') {
            return 301 https://$host$request_uri;
        }

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /api/login {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $client_proto;
        }

        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $client_proto;
        }

        # รูปที่อัปโหลด (ชื่อไฟล์เป็น uuid เดาไม่ได้)
        location /uploads/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            # add_header ใน location ทับของระดับ server ทั้งหมด จึงต้องใส่ซ้ำ ; สลิป/QR ไม่ให้ cache กลาง (proxy/CDN) เก็บ
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
            add_header Cache-Control "private, max-age=86400" always;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $client_proto;
        }
    }
}
