events { 
    worker_connections 1024; 
}
http {
    server {
        listen 80;

        # โยนทราฟฟิกเว็บปกติไปหา Frontend
        location / {
            proxy_pass http://frontend:80; 
        }

        # โยนทราฟฟิกที่มี /api/ ไปหา Backend
        location /api/ {
            proxy_pass http://backend:8000;
        }
    }
}