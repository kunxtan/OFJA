events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    server_tokens off;

    # รูปสลิป/เมนู/โปรไฟล์ส่งมาเป็น base64 ใน JSON (backend จำกัดรูปละ 5 MB)
    client_max_body_size 10m;

    # กันเดารหัสผ่าน: จำกัดจำนวนครั้ง login ต่อ IP (backend ล็อกบัญชีหลังผิด 5 ครั้งซ้ำอีกชั้น)
    limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;

    # ---- HTTP: ใช้ขอ/ต่ออายุใบรับรอง แล้วที่เหลือเด้งไป HTTPS ----
    server {
        listen 80;
        server_name only-foods.cskmitl.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS ----
    server {
        listen 443 ssl;
        http2 on;
        server_name only-foods.cskmitl.com;

        ssl_certificate     /etc/letsencrypt/live/only-foods.cskmitl.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/only-foods.cskmitl.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /api/login {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # รูปที่อัปโหลด (ชื่อไฟล์เป็น uuid เดาไม่ได้)
        location /uploads/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
