# ใช้ชั่วคราวเมื่อยังไม่มีใบรับรอง HTTPS (ตั้ง NGINX_CONF=./nginx.http-only.conf ในไฟล์ .env)
# ข้อควรระวัง: รหัสผ่านและ token วิ่งแบบไม่เข้ารหัส ใช้ทดสอบเท่านั้น
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    client_max_body_size 10m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=300r/m;

    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location ~ ^/api/(login|auth/google/link)$ {
            limit_req zone=login burst=50 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # สลิปและข้อมูลคืนเงินไม่เปิดตรง (L25) : หน้าเว็บขอผ่าน /api/files ที่เช็คสิทธิ์ (backend ก็ไม่ serve ซ้ำอีกชั้น)
        location ~ ^/uploads/(slips|refunds)/ {
            return 404;
        }

        location /uploads/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
