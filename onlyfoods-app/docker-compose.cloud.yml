# Only Foods - สำหรับ server มหาลัย (only-foods.cskmitl.com)
# เว็บอยู่หลัง Cloudflare: HTTPS จัดการที่ Cloudflare แล้วส่งต่อมาที่พอร์ต 80 ของเครื่องนี้
# ค่าลับทั้งหมดอ่านจาก onlyfoods-app/.env บน server (ไม่อยู่ใน git)
# runner เรียกไฟล์นี้ให้เองตอน push ; รันมือ:  sudo docker compose -f docker-compose.cloud.yml up -d --build
services:
  db:
    image: mysql:8.0.32
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?ตั้ง MYSQL_ROOT_PASSWORD ใน .env}
      MYSQL_DATABASE: onlyfood
      MYSQL_USER: ${MYSQL_USER:-onlyfood_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?ตั้ง MYSQL_PASSWORD ใน .env}
      TZ: Asia/Bangkok
    command: --default-time-zone=+07:00 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # ไม่ publish 3306 : ฐานข้อมูลคุยได้เฉพาะ backend ในเครือข่าย docker
    volumes:
      # ชื่อ volume ใหม่ ไม่ชนกับ db_data ของระบบเก่า (ซึ่งเป็นฐาน onlyfoods_db คนละ schema)
      - ofja_db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  backend:
    build: ./backend
    restart: always
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER:-onlyfood_app}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: onlyfood
      JWT_SECRET: ${JWT_SECRET:?ตั้ง JWT_SECRET ใน .env (ยาว 32 ตัวขึ้นไป)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DISABLE_DOCS: ${DISABLE_DOCS:-1}
      TZ: Asia/Bangkok
    volumes:
      - ofja_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: always
    depends_on:
      - backend

  # ทางเข้าเดียว (พอร์ต 80 รับจาก Cloudflare): /api และ /uploads ไป backend ; อื่น ๆ ไป frontend
  proxy:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  ofja_db_data:
  ofja_uploads:
