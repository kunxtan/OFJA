# nginx ในคอนเทนเนอร์ frontend (เสิร์ฟไฟล์ที่ vite build แล้ว) ; proxy หน้าเว็บส่ง / มาที่นี่
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ไฟล์ใน /assets/ มีรหัสของ build ในชื่อ (เปลี่ยนทุกครั้งที่ build) : เก็บ cache ได้ยาว ไม่ต้องถามซ้ำ
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html (และไฟล์อื่นที่ชื่อไม่เปลี่ยน) : ถาม server ทุกครั้ง (ไม่เปลี่ยน = ตอบ 304 ไม่ต้องโหลดใหม่)
    # จะได้ชี้ไฟล์ JS ของ build ล่าสุดเสมอ ; เดิมไม่มี Cache-Control เบราว์เซอร์จึงอาจใช้ index.html เก่า
    # ที่ชี้ไฟล์ของ build ก่อน (ถูกลบไปแล้ว = 404 = หน้าขาว)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
